<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Сабинаға ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle,#ff6b9d,#17001f);

color:white;

display:flex;
justify-content:center;
align-items:center;

}


.card{

text-align:center;
animation:appear 2s;

}


h1{

font-size:70px;
text-shadow:0 0 30px white;

}


p{

font-size:22px;
margin-top:20px;

}



.envelope{

width:260px;
height:170px;

background:white;
color:#ff2e63;

margin:40px auto;

border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;

cursor:pointer;

transition:.5s;

box-shadow:0 0 40px #fff;

}


.envelope:hover{

transform:
scale(1.15)
rotateY(20deg);

}



#letter{

display:none;

max-width:500px;

font-size:22px;

line-height:1.8;

}



#thanks{

position:fixed;

top:50%;
left:50%;

transform:
translate(-50%,-50%)
scale(.2);

opacity:0;

font-size:55px;

font-weight:bold;

text-align:center;

text-shadow:
0 0 40px white;

transition:1s;

}


#thanks.show{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);

}



.heart{

position:absolute;

bottom:-20px;

font-size:30px;

animation:heart 5s linear infinite;

}



@keyframes heart{

0%{

transform:translateY(0) scale(1);

opacity:1;

}

100%{

transform:
translateY(-120vh)
scale(2);

opacity:0;

}

}



@keyframes appear{

from{

opacity:0;
transform:scale(.5);

}

to{

opacity:1;
transform:scale(1);

}

}


</style>

</head>


<body>



<div class="card">


<h1>Сабина ❤️</h1>


<p>
Кейбір адамдар кездейсоқ келмейді...
</p>


<div class="envelope" onclick="openLetter()">

💌 Ашып көр

</div>



<div id="letter"></div>


</div>



<div id="thanks">

Сенің бір түрлі<br>
досың Ернұрдан ❤️

</div>



<script>


let text = `

Сәлем, Сабина ❤️

Мүмкін бәрі біз ойлағандай болмады...

Бірақ өткен әрбір сәт үшін рахмет.

Сенің күлкің, мінезің,
өзгеше әдеттерің есімде қалады.

Мен саған тек бақыт тілеймін ✨

Бұзық болсаң да сүйкімдісің ❤️

— сенің бір түрлі досың Ернұр

`;



let i=0;


function openLetter(){


let box=document.getElementById("letter");

box.style.display="block";


function typing(){

if(i<text.length){

box.innerHTML += text.charAt(i);

i++;

setTimeout(typing,40);

}

}


typing();



setTimeout(()=>{


document.getElementById("thanks")
.classList.add("show");


},8000);



}



setInterval(()=>{


let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";

h.style.animationDuration=
(3+Math.random()*4)+"s";


document.body.appendChild(h);


setTimeout(()=>{

h.remove();

},6000);


},200);



</script>


</body>
</html>
